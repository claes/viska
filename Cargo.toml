[package]
name = "viska"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "One-shot protected text delivery through Linux uinput"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
